tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: 'Partially updates a contact by ID. Allows updating fields like name, phoneNumber, email, contactType, isFavourite, or uploading a new photo.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        $ref: '../../../components/schemas/contactUpdateRequest.yaml'
responses:
  '200':
    description: 'Successfully patched contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Contact not found
