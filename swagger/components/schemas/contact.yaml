type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: 0997776655
  email:
    description: "Contact's email"
    type: string
    example: johndoe@gmail.com
  isFavourite:
    description: 'Indicates whether the contact is marked as a favorite. True means the contact is added to the favorites list.'
    type: boolean
    example: true
  contactType:
    description: 'Defines the category of the contact'
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: 'ID of the user who owns this contact'
    type: string
    example: '683ecbb50d9c3c246c4b4177'
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
